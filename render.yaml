services:


  - type: web
    name: doc-intelligence-backend
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn core.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:


      - key: PYTHON_VERSION
        value: 3.11.8


      - key: DEBUG
        value: "False"


      - key: SECRET_KEY
        generateValue: true


      - key: DATABASE_URL
        fromDatabase:
          name: doc-intelligence-db
          property: connectionString


      - key: GEMINI_API_KEY
        sync: false


databases:


  - name: doc-intelligence-db
    databaseName: doc_intelligence
    user: postgres
